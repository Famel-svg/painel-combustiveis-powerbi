  <text x="205" y="92" text-anchor="middle" font-size="13" fill="#1f4e79">R$ 5,00</text>
  <text x="355" y="134" text-anchor="middle" font-size="13" fill="#1e6b5c">R$ 3,50 = 70%</text>
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="#52606d">Valores fictícios para explicar a regra. Não são dados da ANP.</text>
