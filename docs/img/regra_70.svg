<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Regra dos 70%: valores ilustrativos</text>
  <line x1="80" y1="260" x2="600" y2="260" stroke="#7b8794" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="80" y2="70" stroke="#7b8794" stroke-width="1.5"/>
  <rect x="150" y="100" width="110" height="160" fill="#1f6fb2"/>
  <rect x="300" y="142" width="110" height="118" fill="#2ca58d"/>
  <line x1="80" y1="142" x2="600" y2="142" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="595" y="136" text-anchor="end" font-size="12" fill="#c0392b">70% da gasolina</text>
  <text x="205" y="284" text-anchor="middle" font-size="13" fill="#323f4b">Gasolina R$ 5,00</text>
